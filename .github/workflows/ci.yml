name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Pipeline logic on a small hand-made dataset (no download needed)
      - run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The numbers shown by the dashboard must match the Gold KPI tables
      - run: node --test tests/dashboard_logic.test.js
